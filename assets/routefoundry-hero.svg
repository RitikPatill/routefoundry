<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RouteFoundry</title>
  <desc id="desc">Prompts flow through an evidence gate into an explainable model routing policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#20133a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57d5ff"/>
      <stop offset="1" stop-color="#8a7dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58d6ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8290b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="70" r="170" fill="#6548d8" opacity="0.12"/>
  <circle cx="95" cy="490" r="190" fill="#1ca8d8" opacity="0.09"/>

  <g transform="translate(72 72)">
    <path d="M4 44 L28 6 H82 L106 44 L82 82 H28 Z" fill="none" stroke="url(#hot)" stroke-width="7"/>
    <path d="M30 45 H80 M43 25 L67 65 M67 25 L43 65" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <text x="135" y="54" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1">RouteFoundry</text>
    <text x="138" y="91" fill="#aeb9d7" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="1.3">AUDIT · CONSTRAIN · COMPILE</text>
  </g>

  <g transform="translate(72 220)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#ffffff" font-size="31" font-weight="650">Turn model results into an</text>
    <text x="0" y="42" fill="url(#cool)" font-size="31" font-weight="750">explainable router.</text>
    <text x="0" y="91" fill="#aeb9d7" font-size="18">Set the quality budget. Measure cost, latency and switching.</text>
    <text x="0" y="122" fill="#8190b9" font-size="16">No API key · no hidden judge · no universal-best claim</text>
  </g>

  <g transform="translate(700 192)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="430" height="240" rx="22" fill="#0b1325" stroke="#8998c5" stroke-opacity="0.35"/>
    <text x="32" y="40" fill="#8190b9" font-size="15" letter-spacing="1.2">ONE AUDITABLE DECISION</text>

    <g transform="translate(32 72)">
      <rect width="112" height="50" rx="12" fill="#17203a" stroke="#5dd9ff" stroke-opacity="0.7"/>
      <text x="56" y="31" text-anchor="middle" fill="#eaf7ff" font-size="16">your task</text>
      <path d="M122 25 H166" stroke="#58d6ff" stroke-width="3" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(200 60)">
      <path d="M50 0 L100 29 V87 L50 116 L0 87 V29 Z" fill="#211b3e" stroke="url(#hot)" stroke-width="3" filter="url(#glow)"/>
      <text x="50" y="50" text-anchor="middle" fill="#fff" font-size="14">quality</text>
      <text x="50" y="70" text-anchor="middle" fill="#fff" font-size="14">gate</text>
    </g>

    <path d="M302 118 H335 V74 H365" fill="none" stroke="#ff8a66" stroke-width="3"/>
    <path d="M302 118 H335 V118 H365" fill="none" stroke="#8f83ff" stroke-width="3"/>
    <path d="M302 118 H335 V162 H365" fill="none" stroke="#56d5ff" stroke-width="3"/>
    <circle cx="382" cy="74" r="17" fill="#ff8a66"/><text x="382" y="79" text-anchor="middle" fill="#13101e" font-size="12" font-weight="700">S</text>
    <circle cx="382" cy="118" r="17" fill="#8f83ff"/><text x="382" y="123" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">M</text>
    <circle cx="382" cy="162" r="17" fill="#56d5ff"/><text x="382" y="167" text-anchor="middle" fill="#07151d" font-size="12" font-weight="700">L</text>
    <text x="32" y="214" fill="#aeb9d7" font-size="14">cost · latency · abstention · switch penalty</text>
  </g>

  <text x="72" y="475" fill="#7f8caf" font-family="Segoe UI, Arial, sans-serif" font-size="15">WORKLOAD-SPECIFIC ROUTING EVIDENCE, NOT ROUTING HYPE</text>
</svg>
