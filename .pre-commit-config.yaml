repos:
  - repo: local
    hooks:
      - id: routefoundry-secret-scan
        name: RouteFoundry secret scan
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: true
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]

