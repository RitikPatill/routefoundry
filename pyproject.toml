[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "routefoundry"
version = "0.1.0"
description = "Turn model evaluation results into an explainable router with a quality-loss budget."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ritik Patil" }]
keywords = [
  "llm",
  "model-routing",
  "huggingface",
  "ollama",
  "evaluation",
  "machine-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
space = ["gradio>=5,<7"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
routefoundry = "routefoundry.cli:app"

[project.urls]
Homepage = "https://github.com/RitikPatill/routefoundry"
Documentation = "https://github.com/RitikPatill/routefoundry#readme"
Issues = "https://github.com/RitikPatill/routefoundry/issues"
Source = "https://github.com/RitikPatill/routefoundry"

[tool.hatch.build.targets.wheel]
packages = ["src/routefoundry"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/space",
  "/docs",
  "/assets",
  "/.env.example",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["routefoundry"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["routefoundry"]
