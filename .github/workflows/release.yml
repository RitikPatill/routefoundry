name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/release_gate.py --tag "$RELEASE_TAG"
      - run: uv run python scripts/secret_scan.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/routefoundry
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution metadata and source contents
        shell: bash
        run: |
          set -euo pipefail
          uv run twine check dist/*
          sdist=(dist/*.tar.gz)
          test "${#sdist[@]}" -eq 1
          uv run python scripts/release_gate.py --sdist "${sdist[0]}"
      - name: Smoke-test clean wheel and source-distribution installs
        shell: bash
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1

          for kind in wheel sdist; do
            if [[ "$kind" == "wheel" ]]; then
              artifact="${wheel[0]}"
            else
              artifact="${sdist[0]}"
            fi
            environment="$RUNNER_TEMP/routefoundry-$kind-release"
            uv venv --python 3.11 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            "$environment/bin/routefoundry" --help
            "$environment/bin/python" -m routefoundry --help
          done
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
